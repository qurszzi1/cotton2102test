<!DOCTYPE html>
<html lang="ru">
<head>
     <link rel="icon" href="cotton.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест на проф.ориентацию</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Courier New', monospace;
    }

    html, body {
        height: 100%;
        overflow: hidden;
    }

    body {
        background: #000;
        color: #00ff41;
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    /* Фоновый двоичный код */
    #matrix-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
        opacity: 0.25;
    }

    .binary-col {
        position: absolute;
        top: -100%;
        color: #00ff41;
        font-size: 14px;
        line-height: 1.1;
        white-space: nowrap;
        animation: fall linear infinite;
        text-shadow: 0 0 6px #00ff41;
    }

    @keyframes fall {
        to { transform: translateY(200vh); }
    }

    /* Мерцание / глитч */
    @keyframes flicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.6; }
        94% { opacity: 1; }
        96% { opacity: 0.75; }
        97% { opacity: 1; }
    }

    @keyframes pulse-red {
        0%, 100% { box-shadow: 0 0 10px #ff0033, 0 0 25px #ff0033 inset; }
        50% { box-shadow: 0 0 25px #ff0033, 0 0 50px #ff0033 inset; }
    }

    @keyframes glitch-text {
        0%, 100% { text-shadow: 0 0 8px #00ff41, 0 0 20px #00ff41; transform: translate(0); }
        20% { text-shadow: -2px 0 #ff0033, 2px 0 #00ff41; transform: translate(1px, -1px); }
        40% { text-shadow: 2px 0 #ff0033, -2px 0 #00ff41; transform: translate(-1px, 1px); }
        60% { text-shadow: 0 0 8px #00ff41, 0 0 20px #00ff41; transform: translate(0); }
    }

    .screen {
        display: none;
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 800px;
        background: rgba(0, 0, 0, 0.85);
        border: 2px solid #00ff41;
        border-radius: 8px;
        padding: 40px 35px;
        box-shadow: 0 0 25px #00ff41, 0 0 60px rgba(0, 255, 65, 0.25) inset;
        animation: flicker 4s infinite;
    }

    .screen.active {
        display: block;
    }

    /* Экран старта */
    #start-screen {
        text-align: center;
    }

    h1 {
        font-size: clamp(22px, 4.5vw, 40px);
        color: #00ff41;
        letter-spacing: 3px;
        text-transform: uppercase;
        animation: glitch-text 3s infinite;
        margin-bottom: 18px;
        line-height: 1.3;
    }

    .subtitle {
        font-size: clamp(14px, 2.2vw, 20px);
        color: #ff0033;
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 40px;
        text-shadow: 0 0 10px #ff0033;
    }

    .subtitle::before { content: '> '; }
    .subtitle::after { content: ' <'; }

    .start-btn {
        background: #00ff41;
        color: #000;
        border: none;
        padding: 16px 60px;
        font-size: 22px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 4px;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.2s;
        box-shadow: 0 0 20px #00ff41;
    }

    .start-btn:hover {
        background: #000;
        color: #00ff41;
        box-shadow: 0 0 40px #00ff41, 0 0 20px #00ff41 inset;
        outline: 2px solid #00ff41;
    }

    /* Таймер */
    #timer {
        display: none;
        position: fixed;
        bottom: 25px;
        right: 25px;
        z-index: 10;
        background: #000;
        color: #ff0033;
        border: 2px solid #ff0033;
        padding: 12px 22px;
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 2px;
        border-radius: 4px;
        animation: pulse-red 1.2s infinite;
        font-family: 'Courier New', monospace;
    }

    #timer.warning {
        color: #ff6600;
        border-color: #ff6600;
        animation: pulse-red 0.5s infinite;
    }

    /* Экран вопросов */
    #question-screen {
        text-align: left;
    }

    .progress {
        font-size: 14px;
        color: #00aa33;
        margin-bottom: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .question-text {
        font-size: clamp(16px, 2.4vw, 22px);
        color: #00ff41;
        margin-bottom: 30px;
        line-height: 1.5;
        text-shadow: 0 0 8px rgba(0, 255, 65, 0.5);
    }

    .question-text::before {
        content: '>> ';
        color: #ff0033;
    }

    .answers {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .answer-btn {
        background: #001a00;
        color: #00ff41;
        border: 1px solid #00ff41;
        padding: 16px 20px;
        font-size: 16px;
        text-align: left;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.15s;
        font-family: 'Courier New', monospace;
    }

    .answer-btn:hover {
        background: #00ff41;
        color: #000;
        box-shadow: 0 0 20px #00ff41;
        transform: translateX(5px);
    }

    .answer-btn:disabled {
        cursor: default;
        opacity: 0.6;
    }

    .answer-btn.correct {
        background: #00ff41;
        color: #000;
    }

    .answer-btn.wrong {
        background: #ff0033;
        color: #000;
        border-color: #ff0033;
    }

    /* Финальные экраны */
    #result-screen {
        text-align: center;
        padding: 60px 35px;
    }

    .result-title {
        font-size: clamp(24px, 4vw, 38px);
        text-transform: uppercase;
        letter-spacing: 3px;
        line-height: 1.4;
    }

    .result-success {
        color: #00ff41;
        text-shadow: 0 0 15px #00ff41, 0 0 40px #00ff41;
        animation: glitch-text 2.5s infinite;
    }

    .result-fail {
        color: #ff0033;
        text-shadow: 0 0 15px #ff0033, 0 0 40px #ff0033;
        animation: pulse-red 1.5s infinite;
    }

    .result-detail {
        margin-top: 30px;
        font-size: 15px;
        color: #00aa33;
        letter-spacing: 1px;
    }

    /* Скан-линии поверх всего */
    .scanlines {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.25) 0px,
            rgba(0, 0, 0, 0.25) 1px,
            transparent 1px,
            transparent 3px
        );
        pointer-events: none;
        z-index: 5;
    }
</style>
</head>
<body>

<div id="matrix-bg"></div>
<div class="scanlines"></div>

<!-- Экран старта -->
<div class="screen active" id="start-screen">
    <h1>Тест на проф.ориентацию</h1>
    <div class="subtitle">последняя попытка</div>
    <button class="start-btn" id="start-btn">Начать</button>
</div>

<!-- Экран вопросов -->
<div class="screen" id="question-screen">
    <div class="progress" id="progress"></div>
    <div class="question-text" id="question-text"></div>
    <div class="answers" id="answers"></div>
</div>

<!-- Экран результата -->
<div class="screen" id="result-screen">
    <div class="result-title" id="result-title"></div>
    <div class="result-detail" id="result-detail"></div>
</div>

<!-- Таймер -->
<div id="timer">06:00</div>

<script>
/* ============ ДВОИЧНЫЙ ФОН ============ */
(function createBinaryBackground() {
    const bg = document.getElementById('matrix-bg');
    const cols = 40;
    for (let i = 0; i < cols; i++) {
        const col = document.createElement('div');
        col.className = 'binary-col';
        let text = '';
        for (let j = 0; j < 60; j++) {
            text += Math.random() > 0.5 ? '1' : '0';
            text += '\n';
        }
        col.textContent = text;
        col.style.left = (i * (100 / cols)) + '%';
        col.style.animationDuration = (8 + Math.random() * 12) + 's';
        col.style.animationDelay = (-Math.random() * 20) + 's';
        col.style.fontSize = (10 + Math.random() * 8) + 'px';
        col.style.opacity = 0.3 + Math.random() * 0.7;
        bg.appendChild(col);
    }
})();

/* ============ ВОПРОСЫ (ваши, без изменений) ============ */
const questions = [
    { q: 'Начнём с простого. Как правильно называется наша компания?',
      answers: ['"RGUGGGOTTON0000"', '"Cotton2102"', '"ERROR404"'], correct: 1 },
    { q: 'Сколько сотрудников трудятся на благо нашей компании?',
      answers: ['10', '2102', '120'], correct: 1 },
    { q: 'В чём разница между вами и другим сотрудником?',
      answers: ['Я - лучше!', 'Мы занимаем разные должности.', 'Нет разницы. Мы - единое целое. Свобода есть компания. Cotton есть сила.'], correct: 2 },
    { q: 'Самолюбие - хорошо, но не забывайтесь. Компания - ваша жизнь и ваш дом. Как долго она существует?',
      answers: ['4 года', '36 лет', '20 лет'], correct: 2 },
    { q: 'Повышаем уровень. Ваш новый коллега - чудесный разработчик, но он токсичен. Унижает всех остальных, как хочет. Что эффективнее для компании?',
      answers: ['Игнорировать — главное, чтобы продуктивность не опускалась. Продуктивность важна для компании.', 'Зафиксировать поведение - передать главе компании. Cotton разберётся.', 'Ответить ему той же монетой, подставить. Компания не любит невежд.'], correct: 1 },
    { q: 'Упс! Новый приказ начальства - добавить в систему ПК этого коллеги скрытый сбор данных без его согласия «для аналитики». Ваши действия?',
      answers: ['Сделать — это приказ сверху. Cotton не любит, когда его поручения не выполняют.', 'Отказаться и зафиксировать требование в письменном виде. Закон и этика важнее.', 'Выполнить приказ. Затем слить информацию из личной выгоды. НЕНАВИЖУ ЕГО!'], correct: 1 },
    { q: 'Не будьте глупы! Закон - высшее правило. Пойдем дальше? Компания расширяется и нанимает нового сотрудника, но вот незадача: идеальный технический специалист ужасно высказывается о бывших коллегах. Как посоветуете поступить?',
      answers: ['Нанять. Он профессионал, а профессионализм важен для компании.', 'Он - красный флаг, нужно это запомнить и проверить другие социальные навыки.', 'Мне плевать, я такой же сотрудник и не имею права выбирать.'], correct: 1 },
    { q: 'Теперь проверим ваш профессионализм. Мы ведь не зря вас нанимали? Вы проектируете интерфейс для людей с дислексией. Какое техническое и дизайнерское решение будет наиболее эффективным для повышения читаемости текста?',
        answers: ['Использовать выравнивание текста по ширине (Justify) для создания аккуратных блоков', 'Применить шрифты с засечками (Serif) и уменьшить межстрочный интервал для компактности', 'Использовать выравнивание по левому краю, увеличить межстрочный интервал (line-height) и отказаться от курсива'], correct: 2 },
    { q: 'Вы проводите A/B-тестирование кнопки «Купить». Вариант А (зеленая кнопка) дает больше кликов, но меньше продаж. Вариант Б (серая кнопка) дает меньше кликов, но больше продаж. Какой вариант лучше и почему?',
        answers: ['Вариант А, потому что клики — это главный показатель вовлеченности', 'Вариант Б, так как метрика конверсии в покупку (CR) важнее, чем просто количество кликов', 'Я нажму синюю кнопку'], correct: 1 },
    { q: 'В чем главное отличие UX от UI?',
        answers: ['UX отвечает за визуальную красоту, а UI — за то, как работает код', 'UX — это то, как пользователь чувствует и взаимодействует с продуктом, а UI — это его визуальная оболочка (кнопки, цвета, шрифты)', 'UX — только для сайтов, а UI — только для мобильных приложений'], correct: 1 },
    { q: 'Назовите полное ФИО сотрудника, отвечающего за систему Assembler в нашей компании.',
        answers: ['Беспалов Дмитрий Евгеньевич', 'Беспалов Михаил Евгеньевич', 'Беспалов Евгений Михайлович'], correct: 1 },
    { q: 'В чем главное отличие функции draw() в Processing от аналогичных циклов в обычном программировании?',
        answers: ['Функция draw() выполняется только один раз при запуске', 'Функция draw() автоматически вызывается кадр за кадром (обычно 60 раз в секунду), создавая анимацию без явного написания цикла', 'Функция draw() работает только с 3D-графикой и не поддерживает 2D'], correct: 1 },
    { q: 'Какую должность вы занимаете в компании?',
        answers: ['Frontend-разработчик', 'Системный администратор', 'UX/UI-дизайнер'], correct: 2 },
    { q: 'Компания видит, как вы устали. Компания работает над важным проектом, а ваше выгорание только замедляет продуктивность и добавляет новых ошибок. Поймите, что отпуск - не увольнение, но может им стать. Выбирайте.',
        answers: ['Я буду работать на пределе. Проект важнее отдыха, ошибок больше не будет. Только не увольняйте!', 'Вы правы. Ошибки портят проект, я временно перераспределю свои задачи на остальных.', 'Я не хочу выбирать. Отпустите меня.'], correct: 1 },
    { q: 'Отдых тоже важен, не забывайте заботиться о себе. Компания заботится о вас. Вы уже нашли себе новое рабочее место?',
      answers: ['Я остаюсь здесь.', 'Я остаюсь здесь!', 'Я ОСТАЮСЬ ЗДЕСЬ!!!!!!!!!!!!!!'], correct: 0 }
];

/* ============ ЛОГИКА ============ */
let currentQuestion = 0;
let correctCount = 0;
let timerInterval = null;
let timeLeft = 6 * 60;
let gameActive = false;

let questionTimerInterval = null;
let questionTimeLeft = 30;

const startScreen    = document.getElementById('start-screen');
const questionScreen = document.getElementById('question-screen');
const resultScreen   = document.getElementById('result-screen');
const startBtn       = document.getElementById('start-btn');
const progressEl     = document.getElementById('progress');
const questionTextEl = document.getElementById('question-text');
const answersEl      = document.getElementById('answers');
const timerEl        = document.getElementById('timer');
const resultTitleEl  = document.getElementById('result-title');
const resultDetailEl = document.getElementById('result-detail');

function showScreen(screen) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
}

function startTest() {
    gameActive = true;
    currentQuestion = 0;
    correctCount = 0;
    timeLeft = 6 * 60;

    showScreen(questionScreen);
    timerEl.style.display = 'block';
    updateTimerDisplay();
    timerEl.classList.remove('warning');

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 60) timerEl.classList.add('warning');
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            endTest(true);
        }
    }, 1000);

    renderQuestion();
}

function updateTimerDisplay() {
    const m = Math.floor(Math.max(timeLeft, 0) / 60);
    const s = Math.max(timeLeft, 0) % 60;
    timerEl.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function renderQuestion() {
    if (currentQuestion >= questions.length) {
        endTest(false);
        return;
    }

    const q = questions[currentQuestion];
    questionTextEl.textContent = q.q;

    answersEl.innerHTML = '';
    q.answers.forEach((answer, idx) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = answer;
        btn.addEventListener('click', () => handleAnswer(idx, btn));
        answersEl.appendChild(btn);
    });

    startQuestionTimer();
}

function startQuestionTimer() {
    clearInterval(questionTimerInterval);
    questionTimeLeft = 30;
    updateQuestionTimerDisplay();

    questionTimerInterval = setInterval(() => {
        questionTimeLeft--;
        updateQuestionTimerDisplay();
        if (questionTimeLeft <= 0) {
            clearInterval(questionTimerInterval);
            autoSkipQuestion();
        }
    }, 1000);
}

function updateQuestionTimerDisplay() {
    progressEl.textContent =
        `Вопрос ${currentQuestion + 1} / ${questions.length}` +
        `   |   ⏱ ${String(Math.max(questionTimeLeft,0)).padStart(2,'0')} сек`;

    if (questionTimeLeft <= 10) {
        progressEl.style.color = '#ff0033';
        progressEl.style.textShadow = '0 0 10px #ff0033';
    } else {
        progressEl.style.color = '#00aa33';
        progressEl.style.textShadow = 'none';
    }
}

function autoSkipQuestion() {
    if (!gameActive) return;
    const buttons = answersEl.querySelectorAll('.answer-btn');
    buttons.forEach(b => b.disabled = true);
    const q = questions[currentQuestion];
    buttons[q.correct].classList.add('correct');

    setTimeout(() => {
        currentQuestion++;
        renderQuestion();
    }, 1000);
}

function handleAnswer(idx, btn) {
    if (!gameActive) return;

    clearInterval(questionTimerInterval);

    const q = questions[currentQuestion];
    const buttons = answersEl.querySelectorAll('.answer-btn');
    buttons.forEach(b => b.disabled = true);

    if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
    } else {
        btn.classList.add('wrong');
        buttons[q.correct].classList.add('correct');
    }

    setTimeout(() => {
        currentQuestion++;
        renderQuestion();
    }, 800);
}

function endTest(timeout = false) {
    if (!gameActive) return;
    gameActive = false;
    clearInterval(timerInterval);
    clearInterval(questionTimerInterval);
    timerEl.style.display = 'none';
    timerEl.classList.remove('warning');

    const total = questions.length;
    const passed = correctCount > total / 2;

    showScreen(resultScreen);

    if (passed) {
        resultTitleEl.className = 'result-title result-success';
        resultTitleEl.textContent = 'ТЕСТ ПРОЙДЕН! ВЫ СОХРАНИЛИ РАБОЧЕЕ МЕСТО';
        resultDetailEl.textContent = `Правильных ответов: ${correctCount} / ${total}`;
    } else {
        resultTitleEl.className = 'result-title result-fail';
        resultTitleEl.textContent = 'ТЕСТ ПРОВАЛЕН. ВЫ УВОЛЕНЫ, ПОКИНЬТЕ РАБОЧЕЕ МЕСТО';
        resultDetailEl.textContent = `Правильных ответов: ${correctCount} / ${total}` + (timeout ? ' (время вышло)' : '');
    }
}

startBtn.addEventListener('click', startTest);
</script>
</body>
</html>
